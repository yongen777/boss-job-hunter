<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>BOSS直聘求职猎手</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px; width: 340px;
      font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2328; background: #fff;
    }
    h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    label { font-size: 12px; color: #57606a; width: 52px; flex: 0 0 auto; }
    input[type="text"], input[type="password"] {
      flex: 1 1 auto; min-width: 0; padding: 5px 7px;
      border: 1px solid #d0d7de; border-radius: 5px; font: inherit;
    }
    input:focus { outline: 2px solid #0969da33; border-color: #0969da; }
    button {
      padding: 5px 12px; border: 1px solid #d0d7de; border-radius: 5px;
      background: #f6f8fa; font: inherit; cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    button.primary { background: #1a7f37; border-color: #1a7f37; color: #fff; }
    button.primary:hover { background: #166b2e; }
    .status {
      display: flex; align-items: center; gap: 7px;
      margin: 10px 0; padding: 8px 10px; border-radius: 6px;
      background: #f6f8fa; border: 1px solid #d0d7de;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8c959f; flex: 0 0 auto; }
    .dot.on { background: #1a7f37; box-shadow: 0 0 0 3px #1a7f3722; }
    .dot.off { background: #cf222e; }
    .hint { font-size: 11px; color: #6e7781; margin: 6px 0 10px; }
    .log { margin-top: 10px; border-top: 1px solid #eaeef2; padding-top: 8px; }
    .log ul { list-style: none; margin: 0; padding: 0; max-height: 150px; overflow: auto; }
    .log li { font-size: 11px; padding: 2px 0; display: flex; gap: 6px; }
    .log .t { color: #8c959f; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .log .ok { color: #1a7f37; }
    .log .error { color: #cf222e; }
    .log .warn { color: #9a6700; }
    .log .info { color: #57606a; }
    .log .m { word-break: break-all; }
    code { background: #f6f8fa; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>BOSS直聘求职猎手</h1>

  <div class="row">
    <label for="url">桥地址</label>
    <input id="url" type="text" placeholder="http://127.0.0.1:8898" />
  </div>
  <div class="row">
    <label for="token">配对码</label>
    <input id="token" type="password" placeholder="data/.bridge-token 里的那串" />
  </div>
  <div class="row">
    <button id="save" class="primary">保存并连接</button>
    <button id="pause">暂停</button>
  </div>

  <p class="hint">
    配对码就是项目里 <code>data/.bridge-token</code> 的内容，
    也可以在桥启动时打印的那行看到。
  </p>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="text">读取中…</span>
  </div>

  <div class="log">
    <ul id="log"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
